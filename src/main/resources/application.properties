# ===============================
# Application
# ===============================
spring.application.name=belajar

# ===============================
# Logging
# ===============================
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.web=DEBUG

# ===============================
# Spring Devtools
# ===============================
spring.devtools.add-properties=true
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**,public/**,resources/**,META-INF/**
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400

# ===============================
# Server
# ===============================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/api

# ===============================
# MVC
# ===============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===============================
# Jackson (JSON)
# ===============================
spring.jackson.serialization.indent_output=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===============================
# Database Connection (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA/Hibernate
# ===============================
jakarta.persistence.jdbc.url=${DB_URL}
jakarta.persistence.jdbc.user=${DB_USER}
jakarta.persistence.jdbc.password=${DB_PASS}
jakarta.persistence.jdbc.driver=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# HikariCP Settings
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
